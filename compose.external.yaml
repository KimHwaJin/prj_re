# 외부 DB·Redis·Executor에 연결하는 단일 애플리케이션.
services:
  api:
    build:
      context: .
    image: dtest-agent:local
    command: [python, app.py]
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: stg
      SERVER_PORT: "8000"
      SERVER_RELOAD: "false"
      AGENT_WORKER_ENABLED: "true"
      TASK_RECONCILER_ENABLED: "true"
      EVENT_WORKER_ENABLED: "true"
      EW_HEALTH_PORT: "0"
      CHECKPOINT_SETUP_ON_START: "false"
      EXECUTOR_SHARED_INPUT_ROOT: /workspace/pv
    ports:
      - "8000:8000"
    volumes:
      - ${EXECUTOR_SHARED_INPUT_ROOT_HOST:-./var/executor-inputs}:/workspace/pv
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/service/ready', timeout=3)"]
      interval: 10s
      timeout: 4s
      start_period: 30s
      retries: 12
    stop_grace_period: 70s
    restart: unless-stopped
