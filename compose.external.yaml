# 외부 DB·Redis·Executor에 연결하는 단일 애플리케이션.
services:
  api:
    build:
      context: .
    image: dtest-agent:local
    command: [python, app.py]
    # Match the host profile file group; grant that group read access before starting.
    group_add:
      - "${APP_CONFIG_GID:?Set to the group ID of the mounted profile YAML}"
    environment:
      APP_ENV: ${APP_ENV:-stg}
    ports:
      - "8000:8000"
    volumes:
      - ./config.${APP_ENV:-stg}.yml:/app/config.${APP_ENV:-stg}.yml:ro
      - ${EXECUTOR_SHARED_INPUT_ROOT_HOST:-./var/executor-inputs}:/workspace/shared
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/service/ready', timeout=3)"]
      interval: 10s
      timeout: 4s
      start_period: 30s
      retries: 12
    stop_grace_period: 70s
    restart: unless-stopped
