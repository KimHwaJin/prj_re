apiVersion: v1
kind: ConfigMap
metadata:
  name: dtest-agent-config
data:
  APP_ENV: prd
  SERVER_HOST: 0.0.0.0
  SERVER_PORT: '8000'
  SERVER_RELOAD: 'false'
  AGENT_WORKER_ENABLED: 'true'
  TASK_RECONCILER_ENABLED: 'true'
  GRAPH_CHECKPOINTER: postgres
  CHECKPOINT_SETUP_ON_START: 'false'
  LANGGRAPH_STRICT_MSGPACK: 'true'
  EXECUTOR_SHARED_INPUT_ROOT: /workspace/pv
  EW_NAMESPACE: dtest-agent
  EW_EXECUTOR_EVENT_STREAM: executor.events
  EW_INGRESS_CONCURRENCY: '4'
  EW_POOL_SIZE: '8'
  EW_BATCH_SIZE: '100'
  EW_HEALTH_PORT: '0'
  EVENT_WORKER_ENABLED: 'true'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dtest-agent-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dtest-agent
      component: api
  template:
    metadata:
      labels:
        app: dtest-agent
        component: api
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/path: /service/metrics
        prometheus.io/port: '8000'
    spec:
      securityContext:
        fsGroup: 10001
      containers:
      - name: api
        image: dtest-agent:latest
        imagePullPolicy: IfNotPresent
        command:
        - python
        - app.py
        envFrom:
        - configMapRef:
            name: dtest-agent-config
        - secretRef:
            name: dtest-agent-secrets
        ports:
        - name: http
          containerPort: 8000
        readinessProbe:
          httpGet:
            path: /service/ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /service/live
            port: http
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: '2'
            memory: 4Gi
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
        volumeMounts:
        - name: executor-shared
          mountPath: /workspace/pv
        startupProbe:
          httpGet:
            path: /service/ready
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 60
      volumes:
      - name: executor-shared
        persistentVolumeClaim:
          claimName: dtest-shared-pv
      terminationGracePeriodSeconds: 70
---
apiVersion: v1
kind: Service
metadata:
  name: dtest-agent-api
spec:
  selector:
    app: dtest-agent
    component: api
  ports:
  - name: http
    port: 8000
    targetPort: http
