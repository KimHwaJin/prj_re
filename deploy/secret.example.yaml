# 실제 YAML은 Secret으로 공급합니다. 예제 값을 바꾸고 Git에 커밋하지 마세요.
apiVersion: v1
kind: Secret
metadata:
  name: dtest-agent-secrets
type: Opaque
stringData:
  config.prd.yml: |
    service:
      runtime:
        server_host: 0.0.0.0
        server_port: 8000
      database:
        database_url: postgresql+asyncpg://USER:PASSWORD@POSTGRES_HOST:5432/chat_app
        redis_url: redis://:PASSWORD@REDIS_HOST:6379/0
      checkpoint:
        checkpoint_db_uri: postgresql://USER:PASSWORD@POSTGRES_HOST:5432/agent
      llm:
        model_name: YOUR_MODEL
        api_base_url: https://YOUR_MODEL_HOST/v1
        model_api_key: YOUR_KEY
      executor:
        executor_base_url: http://EXECUTOR_HOST:8080
        executor_submit_enabled: true
        executor_runtime_profile: default
        executor_shared_input_root: /workspace/pv
        executor_shared_result_root: /workspace/pv
      auth:
        sso_adapter_factory: company_sso_adapter:create_adapter
        sso_cookie_secure: true
        sso_public_api_origin: https://YOUR_API_HOST
        sso_frontend_origin: https://YOUR_FRONTEND_HOST
        sso_allowed_origins: []
