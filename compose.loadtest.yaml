name: dtest-agent-loadtest

x-app: &app
  image: dtest-agent:loadtest
  environment:
    APP_ENV: loadtest
    MODEL_PROVIDER: mock
    MODEL_NAME: service-load-mock
    MODEL_MOCK_DELAY_MS: ${LOADTEST_MOCK_DELAY_MS:-0}
    RUN_DIAGNOSTICS_DIR: ${LOADTEST_RUN_DIAGNOSTICS_DIR:-}
    RUN_DIAGNOSTICS_STALL_SECONDS: "5"
    EXECUTOR_SUBMIT_ENABLED: "true"
    EXECUTOR_BASE_URL: http://mock-executor:8080
    EXECUTOR_RUNTIME_PROFILE: ${EXECUTOR_RUNTIME_PROFILE:-ml}
    EXECUTOR_SOURCE_TYPE: INLINE
    EXECUTOR_REPORT_SOURCE_TYPE: INLINE
    DATABASE_URL: postgresql+asyncpg://dtest:loadtest-local@postgres:5432/chat_app
    CHECKPOINT_DB_URI: &checkpoint postgresql://dtest:loadtest-local@postgres:5432/agent?sslmode=disable
    AGENT_CHECKPOINT_DATABASE_URL: *checkpoint
    EW_DATABASE_URL: *checkpoint
    WORKFLOW_DATABASE_URL: *checkpoint
    GRAPH_CHECKPOINTER: postgres
    CHECKPOINT_SETUP_ON_START: "false"
    AGENT_WORKER_ENABLED: "true"
    TASK_RECONCILER_ENABLED: "true"
    REDIS_URL: &redis redis://redis:6379/0
    EW_REDIS_URL: *redis
    EW_NAMESPACE: dtest-agent-loadtest
    PHOENIX_CONFIG_PATH: /nonexistent/loadtest-config.yml
    DEMO_ARTIFACTS_ENABLED: "false"
    DEMO_ARTIFACTS_ROOT: /app/var/demo_artifacts
    EXECUTOR_SHARED_INPUT_ROOT: /workspace/pv
    WORKFLOW_STORAGE_ROOT: /app/var/workflows
    DATA_MOCK: "true"
    LOCAL_BOOTSTRAP_DATABASE_URL: postgresql://dtest:loadtest-local@postgres:5432/postgres
  volumes:
    - artifacts:/app/var
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: dtest
      POSTGRES_PASSWORD: loadtest-local
      POSTGRES_DB: chat_app
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/local/init-databases.sql:/docker-entrypoint-initdb.d/01-agent.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U dtest -d chat_app"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 20
  mock-executor:
    <<: *app
    pull_policy: never
    command: [python, -m, uvicorn, mock_executor:app, --app-dir, /loadtest, --host, 0.0.0.0, --port, "8080"]
    environment:
      MOCK_EXECUTOR_DELAY_MS: ${LOADTEST_EXECUTOR_MOCK_DELAY_MS:-0}
    volumes:
      - ./scripts/loadtest:/loadtest:ro
      - artifacts:/app/var
    ports:
      - "127.0.0.1:${LOADTEST_EXECUTOR_MOCK_PORT:-18081}:8080"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20
  migrate:
    <<: *app
    pull_policy: never
    command: [python, scripts/local/bootstrap.py]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  api:
    <<: *app
    build:
      context: .
    command: [python, -m, uvicorn, "main:app", --app-dir, /app/src, --host, 0.0.0.0, --port, "8000", --workers, "${LOADTEST_WORKERS:-4}"]
    ports:
      - "127.0.0.1:${LOADTEST_PORT:-18080}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      mock-executor:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      start_period: 15s
      retries: 20
  locust:
    profiles: [load-generator]
    image: ${LOADTEST_LOCUST_IMAGE:-dtest-locust:local}
    environment:
      LOADTEST_JOURNEY_LOG: ${LOADTEST_JOURNEY_LOG:-}
    entrypoint: [locust]
    command: [-f, /loadtest/locustfile.py, --host, "http://api:8000", --web-host, 0.0.0.0, --stop-timeout, "180"]
    volumes:
      - ./scripts/loadtest:/loadtest:ro
      - ./var/loadtest:/results
    ports:
      - "127.0.0.1:${LOADTEST_LOCUST_PORT:-18089}:8089"
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres-data:
  artifacts:
