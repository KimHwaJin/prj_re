# 한 애플리케이션: API·Agent·Executor 이벤트 수신의 공용 설정.
name: dtest-agent-local

x-app: &app
  image: dtest-agent:local-dev
  group_add:
    - "${LOCAL_CONFIG_GID:?Generate private YAML with scripts/local.py}"
  environment: &app-environment
    APP_ENV: ${LOCAL_APP_ENV:-dev}
    SERVICE_CONFIG_FILE: /app/workspace/config.compose.yml
  volumes:
    - ./workspace/config.compose.yml:/app/workspace/config.compose.yml:ro
    - artifacts:/app/var
    - executor-inputs:/workspace/pv
    - demo-artifacts:/app/demo_artifacts
    - ${LOCAL_SHARED_INPUT_ROOT}:${LOCAL_SHARED_INPUT_ROOT}
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17
    environment:
      POSTGRES_USER: dtest
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:?Create .env.local with scripts/local.py}
      POSTGRES_DB: chat_app
    ports:
      - "127.0.0.1:${LOCAL_POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/local/init-databases.sql:/docker-entrypoint-initdb.d/01-agent.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U dtest -d chat_app"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    profiles: [local-redis]
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, "yes"]
    ports:
      - "127.0.0.1:${LOCAL_REDIS_PORT:-16379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *app
    environment:
      <<: *app-environment
      LOCAL_BOOTSTRAP_DATABASE_URL: postgresql://dtest:${LOCAL_POSTGRES_PASSWORD}@postgres:5432/postgres
    command: [python, scripts/local/bootstrap.py]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app
    build:
      context: .
      args:
        SOURCE_REVISION: ${LOCAL_SOURCE_REVISION:-working-tree}
    command: [python, app.py]
    stop_grace_period: 70s
    ports:
      - "127.0.0.1:${LOCAL_API_PORT:-18000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/service/ready', timeout=3)"]
      interval: 5s
      timeout: 4s
      start_period: 15s
      retries: 12
    restart: unless-stopped


volumes:
  postgres-data:
  redis-data:
  artifacts:
  executor-inputs:
  demo-artifacts:
