# Only values under service belong to this application.
# YAML values take precedence over environment variables.
service:
  runtime:
    app_name: DTest Agent API
    server_host: 0.0.0.0
    # server_port: 8000  # 기본값. 명시하면 SERVER_PORT 환경변수보다 우선한다.
  checkpoint:
    checkpoint_setup_on_start: false
  agent: {}
    # 프로젝트 메모리: 아래는 기본값 예시. 주입하려면 필요한 항목의 주석을 해제.
    # YAML에 명시한 값이 환경변수보다 우선하며, 변경 후 프로세스 재시작 필요.
    # agent_project_memory_mode: manual  # off/manual/auto_context; 기본 자동 쓰기 없음.
    # agent_project_memory_max_chars: 16000  # 저장 Markdown 본문 문자 수; 출처 제외.
    # agent_project_memory_patch_max_chars: 4000  # Agent 섹션 교체 본문/원문 인용 문자 수.
    # agent_project_memory_max_updates: 4  # 한 번에 갱신할 최대 섹션 수(1~4).
    # agent_project_memory_prompt_max_chars: 6000  # 모델에 넣는 참조 메시지 전체 문자 수.
    # agent_project_memory_prompt_max_tokens: 4096  # UTF-8 byte 기반 보수적 토큰 추정; 정확한 모델 토큰 수 아님.
    # 두 prompt 한도 중 하나가 0이면 Agent 읽기/자동 갱신 중단; 관리 API 유지.
  executor: {}
    # 세션 생성 기본 커널 및 허용 목록 예시. 실제 Executor/Target 등록과 일치시켜야 함.
    # executor_runtime_profile: default  # 기존 미설정 기본값 ml 유지. 환경에 맞게 명시.
    # executor_runtime_profiles: [default, "3102311"]  # 미설정 시 위 기본 profile만 허용.
    # 생성 때 확정해 DB에 저장하며, 설정 변경은 이미 생성된 세션에 덮어쓰지 않음.
  auth:
    # 사내 SDK는 폐쇄망에서 module:factory로 연결. 미설정 로그인은 503이며 헤더 우회는 없다.
    # SSO_ADAPTER_FACTORY, SSO_PUBLIC_API_ORIGIN, SSO_FRONTEND_ORIGIN,
    # SSO_ALLOWED_ORIGINS는 환경별 파일 또는 환경변수로 주입한다.
    sso_auto_register: true
    sso_session_ttl_seconds: 1800  # 고정 30분. 요청으로 연장되지 않는다.
    sso_redis_max_connections: 8  # 기존 Redis 서버 사용, Streams 연결풀과 별도.
    sso_allowed_return_roots: ["/", "/projects"]

  workflow_search: {}
    # 검색 모델은 채팅 모델과 별개. 설정을 모두 제공해야 활성화됩니다.
    # API·Agent가 동일한 DATABASE_URL/CRUD 풀과 이 설정을 공유합니다.
    # workflow_embedding_base_url: https://embedding.example/v1  # /embeddings가 뒤에 붙습니다.
    # workflow_embedding_model: actual-embedding-model
    # workflow_embedding_dimensions: 1024  # 실제 모델 값; HNSW vector는 1~2000 지원.
    # workflow_embedding_api_key: secret  # 실제 값은 환경별 secret으로 주입 권장.
    # workflow_embedding_model_revision: default  # 가중치/차원 변경 때 버전 변경·재색인.
    # workflow_embedding_timeout_seconds: 15  # 입장 대기+전체 batch HTTP의 공통 상한.
    # workflow_embedding_concurrency: 2  # 프로세스당 임베딩 요청 한도; DB 연결 없이 대기.
    # workflow_embedding_batch_size: 32  # 한 HTTP 요청의 문장 수.
    # workflow_search_context_max_chars: 64000  # Agent에 전달할 후보 정의 문자 예산. 완전한 후보 단위로 생략.
    # workflow_search_candidate_limit: 20  # Agent 적용 가능성 검토용 고유 Workflow 수.
    # workflow_search_batch_size: 64  # 각 ANN 조회가 읽는 쿼리 후보 수.
    # workflow_search_max_rounds: 8  # 이미 발견한 Workflow 제외 반복 상한.
    # workflow_search_timeout_ms: 2000  # 임베딩 완료 후 DB 입장·검색·파일 읽기 합계.
    # workflow_search_ef_search: 200  # HNSW 후보 탐색 폭, 정확한 전역 TOPK 보장 아님.
    # workflow_search_max_scan_tuples: 20000  # pgvector iterative scan 예산, 엄격 row 상한 아님.
    # workflow_search_scan_mem_multiplier: 2  # work_mem 대비 scan 메모리 배수.
    # 추천+신규 UI 계획 합계는 MAX_PLAN_CANDIDATES(기본5), 검색 후보 수와 별개.
    # WORKFLOW_RECOMMENDATION_ENABLED=false는 검색 중단; 등록·수정·색인은 유지.
    # WORKFLOW_SIMILARITY_SCORE(기본0.93)는 cosine similarity 최소값, 모델별 검증 필요.
    # migration 후 tools/provision_workflow_index.py 실행. DDL은 API 요청에서 수행하지 않음.
