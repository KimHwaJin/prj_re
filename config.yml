# Only values under service belong to this application.
# YAML values take precedence over environment variables.
service:
  runtime:
    app_name: DTest Agent API
    server_host: 0.0.0.0
    # server_port: 8000  # 기본값. 명시하면 SERVER_PORT 환경변수보다 우선한다.
  checkpoint:
    checkpoint_setup_on_start: false
  agent: {}
    # 프로젝트 메모리: 아래는 기본값 예시. 주입하려면 필요한 항목의 주석을 해제.
    # YAML에 명시한 값이 환경변수보다 우선하며, 변경 후 프로세스 재시작 필요.
    # agent_project_memory_mode: manual  # off/manual/auto_context; 기본 자동 쓰기 없음.
    # agent_project_memory_max_chars: 16000  # 저장 Markdown 본문 문자 수; 출처 제외.
    # agent_project_memory_patch_max_chars: 4000  # Agent 섹션 교체 본문/원문 인용 문자 수.
    # agent_project_memory_max_updates: 4  # 한 번에 갱신할 최대 섹션 수(1~4).
    # agent_project_memory_prompt_max_chars: 6000  # 모델에 넣는 참조 메시지 전체 문자 수.
    # agent_project_memory_prompt_max_tokens: 4096  # UTF-8 byte 기반 보수적 토큰 추정; 정확한 모델 토큰 수 아님.
    # 두 prompt 한도 중 하나가 0이면 Agent 읽기/자동 갱신 중단; 관리 API 유지.
  auth:
    # 사내 SDK는 폐쇄망에서 module:factory로 연결. 미설정 로그인은 503이며 헤더 우회는 없다.
    # SSO_ADAPTER_FACTORY, SSO_PUBLIC_API_ORIGIN, SSO_FRONTEND_ORIGIN,
    # SSO_ALLOWED_ORIGINS는 환경별 파일 또는 환경변수로 주입한다.
    sso_auto_register: true
    sso_session_ttl_seconds: 1800  # 고정 30분. 요청으로 연장되지 않는다.
    sso_redis_max_connections: 8  # 기존 Redis 서버 사용, Streams 연결풀과 별도.
    sso_allowed_return_roots: ["/", "/projects"]
