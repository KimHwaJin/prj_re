# Applied only by an explicit real-Executor mode selection.
services:
  api:
    environment:
      EXECUTOR_BASE_URL: ${EXECUTOR_BASE_URL:?Set EXECUTOR_BASE_URL in .env or the shell}
      EXECUTOR_TLS_VERIFY: ${EXECUTOR_TLS_VERIFY:-true}
      EXECUTOR_RUNTIME_PROFILE: ${EXECUTOR_RUNTIME_PROFILE:-ml}
      EXECUTOR_TIMEOUT_SECONDS: ${EXECUTOR_TIMEOUT_SECONDS:-30}
      EXECUTOR_OPERATION_TIMEOUT_SECONDS: ${EXECUTOR_OPERATION_TIMEOUT_SECONDS:-600}
      EXECUTOR_SHARED_INPUT_ROOT: ${EXECUTOR_SHARED_INPUT_ROOT:-/workspace/pv}
      EXECUTOR_SHARED_RESULT_ROOT: ${EXECUTOR_SHARED_RESULT_ROOT:-/workspace/pv}
