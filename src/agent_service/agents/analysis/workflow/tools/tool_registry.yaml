schema_version: '2.0'
registry_type: tool_registry
description: Python Tool 파일에서 AST로 추출한 함수 호출 정보다. Registry에 등록된 Tool은 모두 Workflow에서 사용할 수 있다.
generation:
  method: python_ast
  llm_used: false
  source_root: agent_service/agents/analysis/workflow/tools
tools:
  data_load:
    category: data_io
    function_name: data_load
    source: data_io/data_load.py
    signature: 'data_load(parquet_path: str=None)'
    docstring: |-
      Parquet 파일을 pandas DataFrame으로 불러옵니다.

      Args:
          parquet_path: 불러올 Parquet 파일의 경로입니다.

      Returns:
          불러온 pandas DataFrame입니다.
    inputs:
      parquet_path:
        type: str
        kind: positional_or_keyword
        has_default: true
        default: null
    returns:
      type: null
      outputs:
        result:
          selector: $
    packages:
    - pandas
  extract_data:
    category: data_io
    function_name: extract_data
    source: data_io/extract_data.py
    signature: 'extract_data(data_type: str, lot_cd: str | None=None, process: list | str | None=None,
      query_mode: str | None=None, start_dt: str | None=None, end_dt: str | None=None, limit: int | None=None,
      **kwargs: object) -> dict[str, object]'
    docstring: |-
      Accept the customer extraction arguments and return a placeholder result.

      This function deliberately performs no file or DataLake access. It only
      preserves the planned call/return contract until the customer implementation
      replaces it. The following transform Tool supplies local wide mock data.
    inputs:
      data_type:
        type: str
        kind: positional_or_keyword
        has_default: false
        default: null
      lot_cd:
        type: str | None
        kind: positional_or_keyword
        has_default: true
        default: null
      process:
        type: list | str | None
        kind: positional_or_keyword
        has_default: true
        default: null
      query_mode:
        type: str | None
        kind: positional_or_keyword
        has_default: true
        default: null
      start_dt:
        type: str | None
        kind: positional_or_keyword
        has_default: true
        default: null
      end_dt:
        type: str | None
        kind: positional_or_keyword
        has_default: true
        default: null
      limit:
        type: int | None
        kind: positional_or_keyword
        has_default: true
        default: null
      kwargs:
        type: object
        kind: var_keyword
        has_default: false
        default: null
    returns:
      type: dict[str, object]
      outputs:
        data:
          selector: '["data"]'
        metadata:
          selector: '["metadata"]'
        preview_data:
          selector: '["preview_data"]'
        shape:
          selector: '["shape"]'
        columns:
          selector: '["columns"]'
        cache_status:
          selector: '["cache_status"]'
        file_path:
          selector: '["file_path"]'
        data_type:
          selector: '["data_type"]'
        query_params:
          selector: '["query_params"]'
        cache_key:
          selector: '["cache_key"]'
    packages: []
  transform_nce:
    category: data_io
    function_name: transform_nce
    source: data_io/transform_nce.py
    signature: 'transform_nce(data: dict | None=None, transform_op: str=''pivot'', index: list | None=None,
      columns: str=''process'', values: list | None=None, aggfunc: str=''last'', **kwargs: object) ->
      dict[str, object]'
    docstring: |-
      Return NCE data in the agreed wide analysis schema.

      Wide input from ``extract_data`` is preserved, including its row limit.
      Other input triggers the deterministic wide NCE mock fallback.
    inputs:
      data:
        type: dict | None
        kind: positional_or_keyword
        has_default: true
        default: null
      transform_op:
        type: str
        kind: positional_or_keyword
        has_default: true
        default: pivot
      index:
        type: list | None
        kind: positional_or_keyword
        has_default: true
        default: null
      columns:
        type: str
        kind: positional_or_keyword
        has_default: true
        default: process
      values:
        type: list | None
        kind: positional_or_keyword
        has_default: true
        default: null
      aggfunc:
        type: str
        kind: positional_or_keyword
        has_default: true
        default: last
      kwargs:
        type: object
        kind: var_keyword
        has_default: false
        default: null
    returns:
      type: dict[str, object]
      outputs:
        data:
          selector: '["data"]'
        shape:
          selector: '["shape"]'
        columns:
          selector: '["columns"]'
        transform_info:
          selector: '["transform_info"]'
    packages:
    - pandas
  transform_wt:
    category: data_io
    function_name: transform_wt
    source: data_io/transform_wt.py
    signature: 'transform_wt(data: dict | None=None, transform_op: str=''wt_fail_pivot'', keep_type: str=''last'',
      pivot: bool=True, index: list | None=None, meta_cols: list | None=None, aggfunc: str=''last'', **kwargs:
      object) -> dict[str, object]'
    docstring: |-
      Return WT symbol data in the agreed wide analysis schema.

      Wide input from ``extract_data`` is passed through. Other local input
      triggers the deterministic WT wide mock fallback.
    inputs:
      data:
        type: dict | None
        kind: positional_or_keyword
        has_default: true
        default: null
      transform_op:
        type: str
        kind: positional_or_keyword
        has_default: true
        default: wt_fail_pivot
      keep_type:
        type: str
        kind: positional_or_keyword
        has_default: true
        default: last
      pivot:
        type: bool
        kind: positional_or_keyword
        has_default: true
        default: true
      index:
        type: list | None
        kind: positional_or_keyword
        has_default: true
        default: null
      meta_cols:
        type: list | None
        kind: positional_or_keyword
        has_default: true
        default: null
      aggfunc:
        type: str
        kind: positional_or_keyword
        has_default: true
        default: last
      kwargs:
        type: object
        kind: var_keyword
        has_default: false
        default: null
    returns:
      type: dict[str, object]
      outputs:
        data:
          selector: '["data"]'
        shape:
          selector: '["shape"]'
        columns:
          selector: '["columns"]'
        transform_info:
          selector: '["transform_info"]'
    packages:
    - pandas
  compute_statistics:
    category: eda
    function_name: compute_statistics
    source: eda/compute_statistics.py
    signature: 'compute_statistics(data: object=None, columns: list=None) -> dict[str, object]'
    docstring: "데이터프레임의 각 컬럼에 대해 기본 통계량을 계산\nArgs: \n    data: pandas DataFrame 객체 또는 dict 컬럼-배열 형식\n\
      \    columns: 통계량을 계산할 컬럼 목록. None이면 모든 수치형/범주형 컬럼.\nReturns:\n    {\"statistics\": dict} - 컬럼별\
      \ 통계량 (수치형: describe, 범주형: count/unique/top/freq)"
    inputs:
      data:
        type: object
        kind: positional_or_keyword
        has_default: true
        default: null
      columns:
        type: list
        kind: positional_or_keyword
        has_default: true
        default: null
    returns:
      type: dict[str, object]
      outputs:
        statistics:
          selector: '["statistics"]'
    packages:
    - pandas
  detect_outliers:
    category: eda
    function_name: detect_outliers
    source: eda/detect_outliers.py
    signature: 'detect_outliers(data: object=None, method: str=''iqr'', columns: list=None) -> dict[str,
      object]'
    docstring: |-
      다양한 방법으로 이상치를 탐지합니다.
      Args:
          data: pandas DataFrame (또는 dict 컬럼-배열 형식)
          method: 탐지 방법 ("iqr", "zscore", "isolation_forest")
          columns: 탐지할 컬럼 (선택사항)
      Returns:
          {"outlier_indices": list, "outlier_report": dict}
    inputs:
      data:
        type: object
        kind: positional_or_keyword
        has_default: true
        default: null
      method:
        type: str
        kind: positional_or_keyword
        has_default: true
        default: iqr
      columns:
        type: list
        kind: positional_or_keyword
        has_default: true
        default: null
    returns:
      type: dict[str, object]
      outputs:
        outlier_indices:
          selector: '["outlier_indices"]'
        outlier_report:
          selector: '["outlier_report"]'
    packages:
    - numpy
    - pandas
    - scikit-learn
  profile_data:
    category: eda
    function_name: profile_data
    source: eda/profile_data.py
    signature: 'profile_data(data: object=None) -> dict[str, object]'
    docstring: |-
      데이터셋의 기본 통계 및 품질을 분석합니다.
      Args:
          data: pandas DataFrame (또는 dict 컬럼-배열 형식)
      Returns:
          {"profile": dict} - row_count, missing_rate 등
    inputs:
      data:
        type: object
        kind: positional_or_keyword
        has_default: true
        default: null
    returns:
      type: dict[str, object]
      outputs:
        profile:
          selector: '["profile"]'
    packages:
    - pandas
  merge_data:
    category: preprocessing
    function_name: merge_data
    source: preprocessing/merge_data.py
    signature: 'merge_data(left_data: object=None, right_data: object=None, join_columns: list=None, how:
      str=''inner'', suffixes: tuple=(''_left'', ''_right''), validate: str=None) -> dict[str, object]'
    docstring: |-
      두 DataFrame을 지정한 공통 컬럼을 기준으로 병합합니다.

      Args:
          left_data: 왼쪽 pandas DataFrame 또는 dict.
          right_data: 오른쪽 pandas DataFrame 또는 dict.
          join_columns: 양쪽 데이터에 공통으로 존재하는 병합 기준 컬럼 목록.
          how: 병합 방식("inner", "left", "right", "outer").
          suffixes: 이름이 겹치는 비기준 컬럼에 붙일 접미사 2개.
          validate: 키 관계 검증 방식. None 또는 "one_to_one",
              "one_to_many", "many_to_one", "many_to_many".

      Returns:
          {"merged_data": DataFrame, "merge_summary": dict}
    inputs:
      left_data:
        type: object
        kind: positional_or_keyword
        has_default: true
        default: null
      right_data:
        type: object
        kind: positional_or_keyword
        has_default: true
        default: null
      join_columns:
        type: list
        kind: positional_or_keyword
        has_default: true
        default: null
      how:
        type: str
        kind: positional_or_keyword
        has_default: true
        default: inner
      suffixes:
        type: tuple
        kind: positional_or_keyword
        has_default: true
        default:
        - _left
        - _right
      validate:
        type: str
        kind: positional_or_keyword
        has_default: true
        default: null
    returns:
      type: dict[str, object]
      outputs:
        merged_data:
          selector: '["merged_data"]'
        merge_summary:
          selector: '["merge_summary"]'
    packages:
    - pandas
