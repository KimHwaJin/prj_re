[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sso"
version = "0.1.0"
description = "Standalone corporate SDK SSO integration for FastAPI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.7,<3.0",
    "redis>=5.3,<6.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.4,<10.0",
    "pytest-asyncio>=1.4,<2.0",
    "ruff==0.16.10",
    "ty==0.0.84",
    "uvicorn>=0.30,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["sso*"]

[tool.setuptools.package-data]
sso = ["py.typed"]

[tool.ruff]
line-length = 79
target-version = "py311"

[tool.ruff.lint]
extend-select = ["E501", "I"]

[tool.ruff.lint.isort]
known-first-party = ["sso", "conftest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ty.environment]
python-version = "3.11"
